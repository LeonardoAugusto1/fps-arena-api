name: CI do FPS Arena

on:
  push:

jobs:
  build:
    runs-on: ubuntu-latest

    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root123
          MYSQL_DATABASE: fps_arena
        ports:
          - 3306:3306

    steps:
      - name: Baixar codigo
        uses: actions/checkout@v4

      - name: Configurar Java
        uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Verificar dependencias
        run: ./mvnw dependency:tree | grep mysql

      - name: Verificar estrutura do projeto
        run: |
          echo "=== LOCAL ATUAL ==="
          pwd

          echo "=== ARQUIVOS DA RAIZ ==="
          ls -la

          echo "=== APPLICATION.PROPERTIES ==="
          find . -name "application.properties" -print

      - name: Testar conexao com MySQL
        run: |
          echo "=== TESTANDO MYSQL ==="
          mysqladmin ping -h mysql -u root -proot123

      - name: Executar testes
        run: ./mvnw test
        env:
          SPRING_PROFILES_ACTIVE: docker

      - name: Fazer build
        run: ./mvnw package -DskipTests