name: CI do FPS Arena

on:
  push:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Baixar codigo
        uses: actions/checkout@v4

      - name: Configurar Java
        uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Executar testes
        run: ./mvnw test

      - name: Fazer build
        run: ./mvnw package -DskipTests