services:

  mysql:
    image: mysql:8.0
    container_name: fps-arena-mysql

    environment:
      MYSQL_ROOT_PASSWORD: root123
      MYSQL_DATABASE: fps_arena

    ports:
      - "3306:3306"

    volumes:
      - mysql_data:/var/lib/mysql

    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-proot123"]
      interval: 5s
      timeout: 5s
      retries: 10


  api:
    build: .
    container_name: fps-arena-api

    ports:
      - "8080:8080"

    environment:
      SPRING_PROFILES_ACTIVE: docker

    depends_on:
      mysql:
        condition: service_healthy


  frontend:
    build: ./fps-arena-site
    container_name: fps-arena-frontend

    ports:
      - "3000:80"

    depends_on:
      - api


volumes:
  mysql_data: